server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: camera-safe-routing-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

management:
  endpoints:
    enabled-by-default: false

app:
  routing:
    pbf-path: ${ROUTING_PBF_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/osm/beijing-latest.osm.pbf}
    graph-cache-path: ${ROUTING_GRAPH_CACHE_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/graph-cache/beijing}
    safety-radius-meters: ${ROUTING_SAFETY_RADIUS_METERS:30}
    calculation-threads: ${ROUTING_CALCULATION_THREADS:4}
    calculation-queue-capacity: ${ROUTING_CALCULATION_QUEUE_CAPACITY:16}
    request-timeout: ${ROUTING_REQUEST_TIMEOUT:10s}
    max-visited-nodes: ${ROUTING_MAX_VISITED_NODES:1000000}
  cameras:
    json-path: ${CAMERA_JSON_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/cameras/map.json}
    snapshot-path: ${CAMERA_SNAPSHOT_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/snapshots}
    source-coordinate-verified: ${CAMERA_SOURCE_COORDINATE_VERIFIED:true}
    max-bbox-results: ${CAMERA_MAX_BBOX_RESULTS:10000}
    max-bbox-span-degrees: ${CAMERA_MAX_BBOX_SPAN_DEGREES:1.0}
  admin:
    local-only: ${ADMIN_LOCAL_ONLY:true}

logging:
  level:
    root: INFO
    cn.camera.safe: INFO
