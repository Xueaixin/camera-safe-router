server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: camera-safe-routing-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

management:
  endpoints:
    enabled-by-default: false

app:
  routing:
    pbf-path: ${ROUTING_PBF_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/osm/jingjinji-latest.osm.pbf}
    graph-cache-path: ${ROUTING_GRAPH_CACHE_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/graph-cache/jingjinji}
    candidate-graph-cache-path: ${ROUTING_CANDIDATE_GRAPH_CACHE_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/graph-cache/jingjinji-compliant-time-v2}
    profile-mode: ${ROUTING_PROFILE_MODE:COMPLIANT_TIME_V2}
    safety-radius-meters: ${ROUTING_SAFETY_RADIUS_METERS:50}
    calculation-threads: ${ROUTING_CALCULATION_THREADS:4}
    calculation-queue-capacity: ${ROUTING_CALCULATION_QUEUE_CAPACITY:16}
    request-timeout: ${ROUTING_REQUEST_TIMEOUT:10s}
    max-visited-nodes: ${ROUTING_MAX_VISITED_NODES:1000000}
  sixth-ring:
    boundary-path: ${SIXTH_RING_BOUNDARY_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/boundaries/sixth-ring-boundary.geojson}
    require-approved-boundary: ${SIXTH_RING_REQUIRE_APPROVED_BOUNDARY:false}
    camera-outside-margin-meters: ${CAMERA_CONTROL_OUTSIDE_MARGIN_METERS:50}
    portal-distance-tier-meters: ${SIXTH_RING_PORTAL_DISTANCE_TIER_METERS:1000}
    max-snap-distance-meters: ${SIXTH_RING_MAX_SNAP_DISTANCE_METERS:100}
    max-join-gap-meters: ${SIXTH_RING_MAX_JOIN_GAP_METERS:100}
    max-visited-states: ${SIXTH_RING_MAX_VISITED_STATES:2000000}
    search-timeout: ${SIXTH_RING_SEARCH_TIMEOUT:5s}
    parallel-candidate-evaluation: ${SIXTH_RING_PARALLEL_CANDIDATE_EVAL:true}
    candidate-evaluation-threads: ${SIXTH_RING_CANDIDATE_EVAL_THREADS:4}
  cameras:
    json-path: ${CAMERA_JSON_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/cameras/camera.json}
    snapshot-path: ${CAMERA_SNAPSHOT_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/snapshots}
    source-coordinate-verified: ${CAMERA_SOURCE_COORDINATE_VERIFIED:true}
    max-bbox-results: ${CAMERA_MAX_BBOX_RESULTS:10000}
    update:
      enabled: ${CAMERA_UPDATE_ENABLED:false}
      source-url: ${CAMERA_UPDATE_SOURCE_URL:https://www.jjz365.cn/CameraData/GetAllRing}
      cron: ${CAMERA_UPDATE_CRON:0 15 3 * * *}
      zone: ${CAMERA_UPDATE_ZONE:Asia/Shanghai}
      download-path: ${CAMERA_UPDATE_DOWNLOAD_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/downloads/cameras}
      failed-path: ${CAMERA_UPDATE_FAILED_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/failed/cameras}
      backup-path: ${CAMERA_UPDATE_BACKUP_PATH:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/backups/cameras}
      connect-timeout: ${CAMERA_UPDATE_CONNECT_TIMEOUT:10s}
      request-timeout: ${CAMERA_UPDATE_REQUEST_TIMEOUT:30s}
      max-download-bytes: ${CAMERA_UPDATE_MAX_DOWNLOAD_BYTES:10485760}
      min-source-record-count: ${CAMERA_UPDATE_MIN_SOURCE_RECORD_COUNT:1000}
      max-source-count-change-ratio: ${CAMERA_UPDATE_MAX_SOURCE_COUNT_CHANGE_RATIO:0.2}
      min-match-rate: ${CAMERA_UPDATE_MIN_MATCH_RATE:0.98}
      max-blocked-edge-change-ratio: ${CAMERA_UPDATE_MAX_BLOCKED_EDGE_CHANGE_RATIO:0.3}
      backup-retention-count: ${CAMERA_UPDATE_BACKUP_RETENTION_COUNT:30}
      snapshot-retention-count: ${CAMERA_UPDATE_SNAPSHOT_RETENTION_COUNT:20}
      failed-retention-count: ${CAMERA_UPDATE_FAILED_RETENTION_COUNT:20}
  admin:
    local-only: ${ADMIN_LOCAL_ONLY:true}

logging:
  file:
    name: ${APP_LOG_FILE:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/logs/camera-safe-routing-server.log}
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    cn.camera.safe: INFO
  logback:
    rollingpolicy:
      file-name-pattern: ${APP_LOG_ARCHIVE_PATTERN:${ROUTING_DATA_ROOT:/camera-safe-routing-data}/logs/archive/camera-safe-routing-server.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${APP_LOG_MAX_FILE_SIZE:50MB}
      max-history: ${APP_LOG_MAX_HISTORY:30}
      total-size-cap: ${APP_LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: ${APP_LOG_CLEAN_HISTORY_ON_START:true}
