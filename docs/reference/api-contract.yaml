openapi: 3.0.3
info:
  title: Camera Safe Routing API
  version: 1.5.0
  description: 京津冀适用摄像头硬避让、六环与通州并集边界、高速主路豁免、入界高速交接兜底和受控区地图接口契约
x-implementation-status: ROUTE_V2_2_CANDIDATE_IMPLEMENTED_AUTOMATED_AND_REAL_DATA_REGRESSION_PASSED_BOUNDARY_APPROVAL_PENDING
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Routes
  - name: Cameras
  - name: ControlledArea
  - name: Operations
paths:
  /api/v1/routes:
    post:
      tags: [Routes]
      operationId: planRoute
      summary: 规划一条避开当前摄像头快照的驾车路线
      description: |
        服务端根据起终点与受控区域并集边界的关系自动选择规划模式，调用方不传入规划模式或通行口。
        成功响应始终包含可直接绘制的完整参考几何；跨界路线同时返回选中的有向通行口、
        可选的严格界外导航交接点、受控侧安全路段和 POI 半径。入界普通道路点不可用时可返回界外高速主路点；
        INTERNAL_SAFE 只按端点分类，不限制完整路线必须留在受控区域内；跨界模式按受控侧
        Dmin + 1000 米分层选择，并用分区道路状态约束禁止释放后进入受控普通道路。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: 已通过独立安全校验并包含受控区域规划语义的路线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 端点冲突或没有合规路线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 起点或终点不在当前路网支持范围，或落在受控区域边界线上而无法稳定分类
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/cameras:
    get:
      tags: [Cameras]
      operationId: listCameras
      summary: 查询当前地图范围内的摄像头点位
      description: |
        只返回当前边界和界外安全边距内真正参与硬禁行的摄像头。查询范围不设置固定经纬度跨度；
        服务根据当前快照中的实际命中数量保护响应规模。
        命中数量超过服务上限时返回 CAMERA_QUERY_RESULT_LIMIT_EXCEEDED，客户端应放大地图后重试。
      parameters:
        - name: minLng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: minLat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: maxLng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: maxLat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: coordinateSystem
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CoordinateSystem'
      responses:
        '200':
          description: 当前快照中位于查询范围内的点位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 查询范围内的实际点位数量超过服务返回上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/controlled-area:
    get:
      tags: [ControlledArea]
      operationId: getControlledArea
      summary: 获取用于地图展示和摄像头作用域判断的受控区
      responses:
        '200':
          description: 后端已转换为 GCJ-02 的 MultiPolygon，保留多面和孔洞结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledAreaResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/camera-snapshots/current:
    get:
      tags: [Cameras]
      operationId: getCurrentCameraSnapshot
      summary: 获取当前有效摄像头和禁行边版本
      responses:
        '200':
          description: 当前有效版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraSnapshotStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/camera-snapshots/refresh:
    post:
      tags: [Operations]
      operationId: refreshCameraSnapshot
      summary: 从配置的本地 JSON 显式重建摄像头和禁行边快照
      description: 首期只能绑定本地管理入口或启用认证，不允许无保护暴露到公网。
      responses:
        '202':
          description: 已接受刷新任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshAccepted'
        '409':
          description: 已有刷新任务执行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/camera-data/update:
    post:
      tags: [Operations]
      operationId: updateCameraData
      summary: 立即下载、校验并发布最新摄像头数据
      description: 仅允许本机调用；与后端内部定时任务复用同一更新流程和防重入锁。
      responses:
        '200':
          description: 已发布新版本，或远程内容与当前版本相同
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraUpdateResult'
        '409':
          description: 已有摄像头更新或快照刷新正在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/health:
    get:
      tags: [Operations]
      operationId: health
      summary: 进程存活检查
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/readiness:
    get:
      tags: [Operations]
      operationId: readiness
      summary: 路网、摄像头快照和禁行边就绪检查
      responses:
        '200':
          description: 服务可接受路线请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: 服务尚未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
components:
  responses:
    BadRequest:
      description: 请求格式、坐标或参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 路网或摄像头快照不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    CoordinateSystem:
      type: string
      enum: [WGS84, GCJ02]
    CoordinateSource:
      type: string
      enum: [AMAP_SEARCH, MAP_PICK, CURRENT_LOCATION]
    VehicleType:
      type: string
      enum: [CAR]
    InputCoordinate:
      type: object
      additionalProperties: false
      required: [lng, lat, coordinateSystem, source]
      properties:
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        coordinateSystem:
          $ref: '#/components/schemas/CoordinateSystem'
        source:
          $ref: '#/components/schemas/CoordinateSource'
        accuracyMeters:
          type: number
          format: double
          minimum: 0
        timestamp:
          type: string
          format: date-time
    OutputCoordinate:
      type: object
      additionalProperties: false
      required: [lng, lat]
      properties:
        lng:
          type: number
          format: double
        lat:
          type: number
          format: double
    RouteRequest:
      type: object
      additionalProperties: false
      required: [start, end, vehicle]
      properties:
        start:
          $ref: '#/components/schemas/InputCoordinate'
        end:
          $ref: '#/components/schemas/InputCoordinate'
        vehicle:
          $ref: '#/components/schemas/VehicleType'
    RouteResponse:
      type: object
      additionalProperties: false
      description: |
        planningMode 是模式判别字段。INTERNAL_SAFE 时 safeSegment 非空；
        CROSS_BOUNDARY_OUTBOUND 和 CROSS_BOUNDARY_INBOUND 时 boundaryDirection、
        boundaryCrossing、safeSegment、referenceSegment 均非空；navigationHandoff 与
        externalHandoff 必须同时非空或同时为空。非空时两者坐标一致且严格位于受控区域外，
        externalHandoff 额外提供动态 POI 搜索半径。EXTERNAL_ONLY 时 safeSegment 为空且
        referenceSegment 为完整参考路线。geometry 始终为完整参考几何。
      required:
        - routeId
        - coordinateSystem
        - planningMode
        - boundaryVersion
        - boundaryDirection
        - boundaryCrossing
        - navigationHandoff
        - externalHandoff
        - safeSegment
        - referenceSegment
        - distanceMeters
        - durationSeconds
        - cameraConflictCount
        - cameraSnapshotVersion
        - blockedEdgeVersion
        - geometry
        - steps
      properties:
        routeId:
          type: string
        coordinateSystem:
          $ref: '#/components/schemas/CoordinateSystem'
        planningMode:
          $ref: '#/components/schemas/RoutePlanningMode'
        boundaryVersion:
          type: string
          description: 本次内外分类和通行口提取使用的受控区域并集边界版本。
        boundaryDirection:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BoundaryDirection'
          description: 仅跨界模式非空。
        boundaryCrossing:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BoundaryCrossing'
          description: 仅跨界模式非空，表示最终路线与受控区域并集边界的物理交点；出界取最终 trace 最早一次有效的受控区到界外交点，入界取实际行驶方向最后一次有效的界外到受控区交点。这是技术审计点，不是内部控制释放点或用户导航端点。
        navigationHandoff:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NavigationHandoff'
          description: 跨界路线中可供用户设为起点或终点的严格界外交接点，也是用户可见地标解析与精确高德导航的坐标锚点。普通道路点始终优先，只在最终路线的技术边界交点外侧 500 米轨迹范围内寻找，并排除高速、连接匝道、隧道、轮渡及无法证明道路类型的点；仅 CROSS_BOUNDARY_INBOUND 在普通道路点不可用时，允许回退到最终路线界外约 300 米、最远 500 米内的高速主路点。找不到可靠点时与 externalHandoff 同时为 null。
        externalHandoff:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExternalHandoff'
          description: 跨界模式下与 navigationHandoff 同时非空或同时为空；非空时两者使用同一严格界外坐标。该兼容字段提供边界净空和后端计算的动态 POI 搜索半径。
        safeSegment:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RouteSegment'
          description: 受控区域内端点与 navigationHandoff 之间的合规路段；交接点为空时改为受控区域内端点与技术边界点之间的路段。EXTERNAL_ONLY 时为空。
        referenceSegment:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RouteSegment'
          description: 与 safeSegment 在 navigationHandoff 或技术边界点连续拼接的参考路段；INTERNAL_SAFE 时为空。
        distanceMeters:
          type: number
          format: double
          minimum: 0
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
        cameraConflictCount:
          type: integer
          minimum: 0
          maximum: 0
          description: 适用摄像头规则道路的冲突数。六环主路和六环外通州区域内的高速主路完全豁免摄像头；六环内其他高速主路永久禁行，普通道路和匝道继续适用摄像头规则。OSM access、单行线、道路关闭和转向限制始终生效；成功响应固定为 0。
        cameraSnapshotVersion:
          type: string
        blockedEdgeVersion:
          type: string
        geometry:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/OutputCoordinate'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RouteStep'
    RoutePlanningMode:
      type: string
      enum:
        - INTERNAL_SAFE
        - CROSS_BOUNDARY_OUTBOUND
        - CROSS_BOUNDARY_INBOUND
        - EXTERNAL_ONLY
    BoundaryDirection:
      type: string
      enum: [OUTBOUND, INBOUND]
    BoundaryRole:
      type: string
      description: 兼容枚举名；OUTER_EXIT 表示出界，INNER_ENTRY 表示入界。
      enum: [OUTER_EXIT, INNER_ENTRY]
    BoundaryCrossing:
      type: object
      additionalProperties: false
      required:
        - portalId
        - direction
        - boundaryRole
        - wgs84
        - gcj02
      properties:
        portalId:
          type: string
          description: 当前路网和边界版本中的不透明通行口标识，不保证跨路网版本稳定。
        roadName:
          type: string
          nullable: true
        direction:
          $ref: '#/components/schemas/BoundaryDirection'
        boundaryRole:
          $ref: '#/components/schemas/BoundaryRole'
        wgs84:
          $ref: '#/components/schemas/OutputCoordinate'
        gcj02:
          $ref: '#/components/schemas/OutputCoordinate'
    ExternalHandoff:
      type: object
      additionalProperties: false
      required:
        - wgs84
        - gcj02
        - boundaryClearanceMeters
        - poiSearchRadiusMeters
      properties:
        wgs84:
          $ref: '#/components/schemas/OutputCoordinate'
        gcj02:
          $ref: '#/components/schemas/OutputCoordinate'
        boundaryClearanceMeters:
          type: number
          format: double
          minimum: 0
          description: 该点到受控区域并集边界的最短距离；该点与 navigationHandoff 坐标一致并严格位于界外。
        poiSearchRadiusMeters:
          type: integer
          minimum: 0
          maximum: 200
          description: 普通道路点按 min(200, floor(max(0, clearance - 25))) 返回；HIGHWAY 交接点固定为 0，前端不得搜索收费站或附近 POI。
    NavigationHandoff:
      type: object
      additionalProperties: false
      required:
        - wgs84
        - gcj02
        - boundaryClearanceMeters
        - roadName
        - type
      properties:
        wgs84:
          $ref: '#/components/schemas/OutputCoordinate'
        gcj02:
          $ref: '#/components/schemas/OutputCoordinate'
        boundaryClearanceMeters:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: 该严格界外交接点到受控区域并集边界的最短距离；高速兜底不要求 250 米净空。
        roadName:
          type: string
          nullable: true
          description: GraphHopper 路网中的道路名称；无名称时为空。
        type:
          type: string
          enum: [ORDINARY_ROAD, HIGHWAY]
          description: HIGHWAY 只允许出现在 CROSS_BOUNDARY_INBOUND 的普通道路点兜底中。
    ControlledAreaResponse:
      type: object
      additionalProperties: false
      required:
        - boundaryVersion
        - coordinateSystem
        - geometry
        - approvedForProduction
        - cameraOutsideMarginMeters
      properties:
        boundaryVersion:
          type: string
        coordinateSystem:
          type: string
          enum: [GCJ02]
        geometry:
          $ref: '#/components/schemas/ControlledAreaGeometry'
        approvedForProduction:
          type: boolean
        cameraOutsideMarginMeters:
          type: number
          format: double
          minimum: 0
    ControlledAreaGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiPolygon]
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: array
              minItems: 4
              items:
                $ref: '#/components/schemas/OutputCoordinate'
    RouteSegment:
      type: object
      additionalProperties: false
      required: [distanceMeters, durationSeconds, geometry]
      properties:
        distanceMeters:
          type: number
          format: double
          minimum: 0
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
        geometry:
          type: array
          minItems: 2
          description: 坐标系与 RouteResponse.coordinateSystem 一致。
          items:
            $ref: '#/components/schemas/OutputCoordinate'
    RouteStep:
      type: object
      additionalProperties: false
      required: [instruction, distanceMeters, durationSeconds, startIndex, endIndex]
      properties:
        instruction:
          type: string
        roadName:
          type: string
          nullable: true
        distanceMeters:
          type: number
          format: double
          minimum: 0
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
        startIndex:
          type: integer
          minimum: 0
        endIndex:
          type: integer
          minimum: 0
    CameraPage:
      type: object
      additionalProperties: false
      required: [coordinateSystem, snapshotVersion, items]
      properties:
        coordinateSystem:
          $ref: '#/components/schemas/CoordinateSystem'
        snapshotVersion:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CameraView'
    CameraView:
      type: object
      additionalProperties: false
      required: [id, lng, lat, address, cameraType]
      properties:
        id:
          type: string
        lng:
          type: number
          format: double
        lat:
          type: number
          format: double
        address:
          type: string
        cameraType:
          type: string
        directionText:
          type: string
          nullable: true
    CameraSnapshotStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - snapshotVersion
        - blockedEdgeVersion
        - cameraCount
        - sourceCameraCount
        - outsideControlAreaCameraCount
        - cameraOutsideMarginMeters
        - controlBoundaryVersion
        - safetyRadiusMeters
        - loadedAt
      properties:
        status:
          type: string
          enum: [READY]
        snapshotVersion:
          type: string
        blockedEdgeVersion:
          type: string
        cameraCount:
          type: integer
          minimum: 0
          description: 实际参与硬禁行并由摄像头查询接口展示的数量。
        sourceCameraCount:
          type: integer
          minimum: 0
          description: 通过旧 IsSixRingOut 源数据过滤后保留的总数。
        outsideControlAreaCameraCount:
          type: integer
          minimum: 0
          description: 距受控区边界超过 cameraOutsideMarginMeters、已在界外解禁的数量。
        cameraOutsideMarginMeters:
          type: number
          format: double
          minimum: 0
        controlBoundaryVersion:
          type: string
        safetyRadiusMeters:
          type: number
          format: double
          minimum: 0
        loadedAt:
          type: string
          format: date-time
    RefreshAccepted:
      type: object
      additionalProperties: false
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [ACCEPTED]
    CameraUpdateResult:
      type: object
      additionalProperties: false
      required:
        - status
        - sourceSha256
        - sourceRecordCount
        - retainedRecordCount
        - excludedRecordCount
        - unrecognizedIsSixRingOutCount
        - restrictedCameraCount
        - outsideControlAreaCameraCount
        - cameraOutsideMarginMeters
        - controlBoundaryVersion
        - matchedCameraCount
        - unmatchedCameraCount
        - blockedEdgeCount
        - completedAt
      properties:
        status:
          type: string
          enum: [UPDATED, NO_CHANGE]
        sourceSha256:
          type: string
        previousSourceSha256:
          type: string
          nullable: true
        sourceRecordCount:
          type: integer
          minimum: 1
        retainedRecordCount:
          type: integer
          minimum: 1
        excludedRecordCount:
          type: integer
          minimum: 0
        unrecognizedIsSixRingOutCount:
          type: integer
          minimum: 0
        restrictedCameraCount:
          type: integer
          minimum: 0
        outsideControlAreaCameraCount:
          type: integer
          minimum: 0
        cameraOutsideMarginMeters:
          type: number
          format: double
          minimum: 0
        controlBoundaryVersion:
          type: string
        matchedCameraCount:
          type: integer
          minimum: 0
        unmatchedCameraCount:
          type: integer
          minimum: 0
        blockedEdgeCount:
          type: integer
          minimum: 0
        completedAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, graphLoaded, sixthRingTopologyLoaded, cameraSnapshotLoaded, blockedEdgesLoaded]
      properties:
        status:
          type: string
          enum: [READY, NOT_READY]
        graphLoaded:
          type: boolean
        sixthRingTopologyLoaded:
          type: boolean
        cameraSnapshotLoaded:
          type: boolean
        blockedEdgesLoaded:
          type: boolean
        reason:
          type: string
          nullable: true
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - INVALID_COORDINATE
        - UNSUPPORTED_COORDINATE_SYSTEM
        - OUTSIDE_ROUTING_BOUNDS
        - START_IN_RESTRICTED_AREA
        - END_IN_RESTRICTED_AREA
        - NO_COMPLIANT_ROUTE
        - ROUTE_SEARCH_TIMEOUT
        - ROUTE_SEARCH_RESOURCE_LIMIT
        - SIXTH_RING_TOPOLOGY_NOT_READY
        - SIXTH_RING_BOUNDARY_AMBIGUOUS
        - REFERENCE_ROUTE_FAILED
        - ROUTE_CONFLICT_DETECTED
        - ROUTING_NOT_READY
